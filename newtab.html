<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Clocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timezone-controls">
    <select id="clockSelector">
      <option value="0">Clock 1</option>
      <option value="1">Clock 2</option>
      <option value="2">Clock 3</option>
      <option value="3">Clock 4</option>
      <option value="4">Clock 5</option>
      <option value="5">Clock 6</option>
    </select>
    <div class="search-container">
      <input type="text" id="timezoneSearch" placeholder="Search cities..." autocomplete="off">
      <div id="timezoneDropdown" class="search-dropdown">
        <!-- Filtered options will be populated by JavaScript -->
      </div>
    </div>
  </div>
  <main id="grid">
    <!-- Clocks will be injected here -->
  </main>
  <script src="script.js"></script>
</body>
</html>
